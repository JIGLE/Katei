name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify tooling
        run: |
          python -m pip install --upgrade pip
          pip install "graphifyy[mcp]"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      # --code-only indexes the code via local AST. Without it graphify wants an
      # LLM API key to semantically extract the repo's docs and images, and with
      # no key configured the step exits 1 — this job has never passed without
      # the flag. Drop it if a key is ever added as a repo secret.
      - name: Build Graphify knowledge graph
        run: |
          mkdir -p graphify-out
          graphify . --code-only --output graphify-out/graph.json

name: Build & Push to GHCR

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "Dockerfile"
      - "entrypoint.sh"
      - "restore.sh"
      - "schema.sql"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two merges seconds apart produced two concurrent runs both pushing `latest`,
# where whichever finished last won regardless of which commit was newer.
# `latest` is what the TrueNAS deployment pulls, so it has to track the newest
# commit on main; the superseded run is cancelled and that commit gets no
# `sha-` image, which is the right trade here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: katei
          POSTGRES_PASSWORD: katei
          POSTGRES_DB: katei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katei"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          # Integration tests run the route layer against this database; the
          # pure unit tests ignore it. Without DATABASE_URL they skip cleanly.
          DATABASE_URL: postgresql://katei:katei@localhost:5432/katei_test

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    # Deliberately not `needs: test` — they're independent signals, and
    # serialising them added ~90s to every run. `build` still gates on both.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: katei
          POSTGRES_PASSWORD: katei
          POSTGRES_DB: katei_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katei"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://katei:katei@localhost:5432/katei_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cached per package, not as one combined key. `cache: npm` with three
      # lockfiles hashes them together, so touching one package's lockfile
      # cold-installed all three — which is what happened when sharp landed.
      # Keys carry the OS and node version so a cached native binary can never
      # be restored onto a runner it wasn't built for.
      - name: Cache frontend node_modules
        id: fe-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: fe-${{ runner.os }}-node22-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.fe-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # The backend serves the SPA from ./public in production; mirror that
      # shape so the suite exercises the real single-origin deployment.
      - name: Copy SPA into backend
        run: cp -r frontend/dist backend/public

      - name: Cache backend node_modules
        id: be-modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: be-${{ runner.os }}-node22-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend dependencies
        if: steps.be-modules.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # schema.sql normally runs via the postgres image's init hook; a CI
      # service container starts before checkout, so apply it explicitly.
      - name: Apply base schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f schema.sql
        env:
          PGPASSWORD: katei

      - name: Boot the app
        working-directory: backend
        run: |
          node dist/index.js > /tmp/katei-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "server failed to become healthy"
          cat /tmp/katei-server.log
          exit 1
        env:
          JWT_SECRET: e2e-ci-secret
          PORT: "3000"

      - name: Cache e2e node_modules
        id: e2e-modules
        uses: actions/cache@v4
        with:
          path: e2e/node_modules
          key: e2e-${{ runner.os }}-node22-${{ hashFiles('e2e/package-lock.json') }}

      # The browser download is the slow part (~2.5 min). `playwright install`
      # skips browsers already on disk, so a cache hit leaves only the apt
      # system-deps step to run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e dependencies
        if: steps.e2e-modules.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npm ci

      - name: Install Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        working-directory: e2e
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            /tmp/katei-server.log
          retention-days: 7

  build:
    name: Build single image
    runs-on: ubuntu-latest
    needs: [test, e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expose ACTIONS_CACHE_URL / RUNTIME_TOKEN so `type=gha` cache works when we
      # drive buildx directly (below) instead of via build-push-action.
      - name: Expose GitHub Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jigle/katei
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Booting the docker-container builder pulls moby/buildkit from Docker Hub,
      # which occasionally resets the connection and fails the whole run. Retry the
      # builder bootstrap + build so a transient Docker Hub blip doesn't block a ship.
      - name: Build & push (with retry on transient Docker Hub flakes)
        uses: nick-fields/retry@v3
        env:
          # Pass the (newline-separated) tags as an env var so the shell doesn't
          # choke on the multiline value; expand each line to a --tag flag below.
          TAGS: ${{ steps.meta.outputs.tags }}
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            docker buildx inspect katei >/dev/null 2>&1 \
              || docker buildx create --name katei --driver docker-container --use --bootstrap
            docker buildx use katei
            docker buildx build \
              --push \
              $(printf '%s\n' "$TAGS" | sed 's/^/--tag /') \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --file Dockerfile \
              .

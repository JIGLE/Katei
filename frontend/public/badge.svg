<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Android's notification badge. The status-bar icon is built from the
       ALPHA CHANNEL ONLY: colour is discarded and the silhouette is tinted
       flat white. So this file must be transparent everywhere except the
       strokes — icon.svg's full-bleed background plate is what made the
       notification render as a plain white square.

       The monogram alone, at icon.svg's 140:190 proportion, no emerald rule:
       at 24dp a second colour cannot survive the flattening anyway, and
       BRAND.md §1 already lets the mark stand in for the lockup in tight
       spaces. Stroke is 12 rather than icon.svg's scaled-down ~8 — chosen by
       rendering the alpha at 24/48/72px and looking: 8 goes faint at 24px and
       14 closes the counters where the diagonals meet the upright.

       Visual box (paths plus round caps) is 58x76, centred in 96. -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round">
    <path d="M24.42 16V80"/>
    <path d="M24.42 48L71.58 16"/>
    <path d="M24.42 48L71.58 80"/>
  </g>
</svg>
